name: Build All Platforms

on:
  push:
  workflow_dispatch:

env:
  CREATE: flutter create --org com.purebili --project-name purebili

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - shell: pwsh
        run: if (-not (Test-Path windows)) { flutter create --org com.purebili --project-name purebili --platforms=windows . }
      - run: dart run tool/patch_platforms.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PureBili-windows-x64
          path: build/windows/x64/runner/Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: '[ -d android ] || $CREATE --platforms=android .'
      - run: dart run tool/patch_platforms.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PureBili-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: '[ -d macos ] || $CREATE --platforms=macos .'
      - run: dart run tool/patch_platforms.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build macos --release
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/purebili.app PureBili-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PureBili-macos
          path: PureBili-macos.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: '[ -d ios ] || $CREATE --platforms=ios .'
      - run: dart run tool/patch_platforms.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr PureBili-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PureBili-ios-unsigned
          path: PureBili-ios-unsigned.ipa
